# Production-style stack: MySQL + API + web (nginx serving the built SPA and proxying /api).
# First run:  docker compose up -d --build
#             docker compose exec api python -m scripts.import_geo --source-dir /data/source
#             docker compose exec api python -m scripts.seed --source-dir /data/source --admin-password '<strong password>'
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: soldier-management
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/soldier-management?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      STORAGE_DIR: /app/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - storage:/app/storage
      - ./:/data/source:ro   # geography .sql files for the import script
    depends_on:
      - db
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  storage:
